[package]
name = "notebook-core"
version = "0.1.0"
edition = "2021"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[dev-dependencies]
proptest = "1.12"
notebook-extract = { path = "../notebook-extract" }
zip = { version = "2", default-features = false, features = ["deflate"] }
